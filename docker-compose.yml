services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Bogota
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - net_facturas

  n8n:
    build: .
    container_name: n8n_app
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
      - NODE_FUNCTION_ALLOW_EXTERNAL=jszip,xml2js
      - CODE_ENABLE_STDOUT=false
      - PYTHONUNBUFFERED=1
      - N8N_LOG_LEVEL=info
      - TZ=America/Bogota
      # Limpieza automática de la base de datos de n8n para que no colapse el disco
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=3600
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_NODES_INCLUDE=["n8n-nodes-base.executeCommand"]
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - net_facturas

volumes:
  pg_data:
  n8n_data:

networks:
  net_facturas:
    driver: bridge
